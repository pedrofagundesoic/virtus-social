name: social-daily
on:
  schedule:
    # Brasil sem horário de verão desde 2019: America/Sao_Paulo = UTC-3 o ano todo.
    # O GitHub atrasa agendamentos em horas (02/11: 5h45) e às vezes os descarta. Por isso há tentativas antes da janela:
    # no horário fazem nada; atrasadas, caem nela. O script posta 1×/dia, só de 18:00 a 23:59 de America/Sao_Paulo.
    # Além disso, um agendador externo (cron-job.org) dispara este workflow com mode=tick na janela: ver social/AGENDADOR-EXTERNO.md.
    - cron: '37 18 * * *'  # 15:37 BRT
    - cron: '37 19 * * *'  # 16:37 BRT
    - cron: '37 20 * * *'  # 17:37 BRT
    - cron: '37 21 * * *'  # 18:37 BRT
    - cron: '37 22 * * *'  # 19:37 BRT
    - cron: '37 23 * * *'  # 20:37 BRT
    - cron: '37 0 * * *'   # 21:37 BRT (00:37 UTC do dia seguinte)
    - cron: '37 9 * * *'   # 06:37 BRT: confere ontem; se ficou sem post, a execução falha e o GitHub avisa por e-mail
  workflow_dispatch:       # "Run workflow" = postar agora (só para UM dia perdido)
    inputs:
      mode:
        description: 'force = posta agora, ignorando a janela. tick = só posta se estiver na janela e ainda não postou hoje (usado pelo agendador externo).'
        type: choice
        options: [force, tick]
        default: force
permissions:
  contents: write          # para commitar social/state.json
concurrency: social-daily
jobs:
  post:
    # Desarmado até a FASE 1: crie a Variable SOCIAL_ENABLED=true quando os Secrets do Meta existirem.
    if: ${{ vars.SOCIAL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: tick
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SOCIAL_MANIFEST_URL: ${{ vars.SOCIAL_MANIFEST_URL }}
          SOCIAL_TZ: ${{ vars.SOCIAL_TZ || 'America/Sao_Paulo' }}
          SOCIAL_POST_HOUR: ${{ vars.SOCIAL_POST_HOUR || '18' }}
        run: node server/publish-once.js ${{ github.event_name == 'workflow_dispatch' && inputs.mode != 'tick' && '--force' || '' }}
      - name: persist state
        if: ${{ always() }}
        run: |
          [ -f social/state.json ] || exit 0
          git config user.name  "social-bot"
          git config user.email "social-bot@users.noreply.github.com"
          git add social/state.json
          git diff --cached --quiet && exit 0
          git commit -m "social: state $(date -u +%F) [skip ci]"
          git pull --rebase
          git push
